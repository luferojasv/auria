name: appluisa
description: "Seguimiento de entrenamiento, sueño y actividad en una sola app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_web_auth_2: ^5.0.3
  go_router: ^17.3.0
  http: ^1.6.0
  # 0.20.2 exacto: es lo que fija flutter_localizations desde el SDK.
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/exercises_es.json

  # Inter es una fuente variable: el mismo fichero sirve para todos los pesos.
  # Declarar cada peso apuntando al mismo asset hace que Flutter instancie el
  # eje `wght` en vez de fingir la negrita engordando los trazos.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
